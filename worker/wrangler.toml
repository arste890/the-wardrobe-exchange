name = "the-wardrobe-exchange-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Non-secret configuration. Secrets go in `wrangler secret put` (prod) or .dev.vars (local).
[vars]
PUBLIC_SITE_URL = "http://localhost:4321"
# Comma-separated origins allowed to call /checkout and /admin from the browser.
ALLOWED_ORIGINS = "http://localhost:4321,https://arste890.github.io"
# Enabled marketplace channels: "mock" for development, "ebay" once connected.
CHANNELS = "mock"
# GitHub repo that hosts the site, used for repository_dispatch rebuilds (owner/name).
GITHUB_REPO = "arste890/the-wardrobe-exchange"

[[d1_databases]]
binding = "DB"
database_name = "the-wardrobe-exchange"
# Replace with the id printed by `wrangler d1 create the-wardrobe-exchange`. Any value works for local dev.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "the-wardrobe-exchange-photos"

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true
